name: Update results and deploy

on:
  schedule:
    # 19:17 and 23:17 Thai time every day: refresh news, add any new draw, redeploy
    - cron: "17 12,16 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest results
        run: git clone --depth 1 https://github.com/vicha-w/thai-lotto-archive.git /tmp/upstream

      - name: Rebuild data.json
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          SIX, THREE = re.compile(r"\d{6}"), re.compile(r"\d{3}")
          COUNTS = [("SECOND", 5), ("THIRD", 10), ("FOURTH", 50), ("FIFTH", 100)]
          src = "/tmp/upstream/lottonumbers"
          draws = []
          for name in sorted(os.listdir(src)):
              if not name.endswith(".txt"):
                  continue
              rows = {}
              for line in open(os.path.join(src, name), encoding="utf-8"):
                  parts = line.split()
                  if parts:
                      rows[parts[0]] = parts[1:]
              f = [x for x in rows.get("FIRST", []) if SIX.fullmatch(x)]
              t = [x for x in rows.get("TWO", []) if re.fullmatch(r"\d{2}", x)]
              if not f or not t:
                  print("skipped", name)
                  continue
              r = {"d": name[:-4], "f": f[0], "t": t[0]}
              for key, out in (("THREE_FIRST", "tf"), ("THREE_LAST", "tl"), ("THREE", "t3")):
                  vals = [x for x in rows.get(key, []) if THREE.fullmatch(x)]
                  if vals:
                      r[out] = vals
              prizes = []
              for key, n in COUNTS:
                  vals = [x for x in rows.get(key, []) if SIX.fullmatch(x)]
                  if len(vals) != n:
                      prizes = None
                      break
                  prizes += vals
              if prizes:
                  r["p"] = "".join(prizes)
              draws.append(r)
          old = json.load(open("data.json", encoding="utf-8"))
          if len(draws) < len(old) or draws[-1]["d"] < old[-1]["d"]:
              sys.exit(f"rejected: upstream has {len(draws)} draws, current has {len(old)}")
          json.dump(draws, open("data.json", "w", encoding="utf-8"), separators=(",", ":"))
          print(f"{len(old)} -> {len(draws)} draws, latest {draws[-1]['d']}")
          PY

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update lottery results"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare site
        run: mkdir _site && cp index.html data.json _site/

      - name: News to numbers
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          FEED = "https://news.google.com/rss?hl=th&gl=TH&ceid=TH:th"
          # Skip tragedies, crime and lottery tips: turning someone's loss into numbers can hurt the people involved
          SKIP = re.compile("ตาย|เสียชีวิต|ศพ|ดับสลด|ดับคาที่|ดับ\\s?\\d|สลด|อุบัติเหตุ|รถชน|ชนกัน|ถูกชน|ชนท้าย|ประสานงา|คว่ำ|ไฟไหม้|เพลิงไหม้|จมน้ำ|ฆ่า|ฆาตกร|ยิง|แทง|ข่มขืน|ล่วงละเมิด|ทำร้าย|ทารุณ|บาดเจ็บ|ระเบิด|ลักพาตัว|ผูกคอ|โดดตึก|ป่วยหนัก|โคม่า|สูญหาย|แผ่นดินไหว|น้ำท่วม|หวย|เลขเด็ด|ลอตเตอรี่|สลาก")
          PLATE = re.compile(r"\d?[ก-ฮ]{1,2}\s?\d{1,4}")
          THAI_DIGITS = str.maketrans("๐๑๒๓๔๕๖๗๘๙", "0123456789")
          VAL = {}
          for n, chars in {1: "กดถทภฤาำุ่", 2: "ขชงบปเแู้", 3: "ฆฑฒตฃฅ๋", 4: "คธรญษะโิั", 5: "ฉณฌนมหฮฎฬึ",
                           6: "จลวอใ", 7: "ศสซีื๊", 8: "ยพฟผฝ็", 9: "ฏฐไ์"}.items():
              for c in chars:
                  VAL[c] = n

          def numbers_in(title):
              text = PLATE.sub(" ", title.translate(THAI_DIGITS)) if re.search(r"ทะเบียน", title) else title.translate(THAI_DIGITS)
              out = []
              for m in re.finditer(r"\d[\d,]*(?:\.\d+)?", text):
                  raw = m.group().replace(",", "")
                  digits = raw.replace(".", "")
                  if re.fullmatch(r"(25|20|19)\d\d", raw):   # skip years
                      continue
                  if len(digits) == 1:
                      two = "0" + digits
                  else:
                      two = digits[-2:]
                  out.append({"from": m.group(), "n": two})
              return out[:3]

          def main(out_path):
              req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0 thai-lotto-stats"})
              xml = urllib.request.urlopen(req, timeout=30).read()
              items = []
              for it in ET.fromstring(xml).iter("item"):
                  title = (it.findtext("title") or "").strip()
                  src = (it.findtext("source") or "").strip()
                  if src and title.endswith(" - " + src):
                      title = title[: -len(" - " + src)]
                  if not title or SKIP.search(title):
                      continue
                  nums = numbers_in(title)
                  how = "ตัวเลขในหัวข่าว"
                  if not nums:
                      total = sum(VAL.get(c, 0) for c in title)
                      nums = [{"from": f"ผลรวม {total}", "n": f"{total % 100:02d}"}]
                      how = "ถอดค่าอักษรหัวข่าวตามเลขศาสตร์"
                  try:
                      when = parsedate_to_datetime(it.findtext("pubDate")).isoformat()
                  except Exception:
                      when = ""
                  items.append({"title": title, "src": src, "link": it.findtext("link") or "", "when": when, "nums": nums, "how": how})
                  if len(items) >= 8:
                      break
              if not items:
                  sys.exit("no usable news items")
              json.dump({"items": items}, open(out_path, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              print(f"{len(items)} news items")

          main("_site/news.json")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
